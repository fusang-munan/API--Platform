name: Lab TLS smoke test

on:
  pull_request:
    paths:
      - '.github/workflows/lab-tls.yml'
      - 'scripts/test-lab-port.sh'
      - 'scripts/compose-local.sh'
      - '.gitattributes'
      - 'VERSION'
      - 'frontend/Dockerfile'
      - 'frontend/.dockerignore'
      - 'frontend/lab-maintenance/**'
      - 'frontend/nginx.conf'
      - 'compose.yaml'
      - 'compose.local.yaml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the school frontend port
        env:
          NGINX_IMAGE: docker.io/library/nginx:1.29.1-alpine3.22
          CHECK_LEGACY_BIND: '1'
        run: bash scripts/test-lab-port.sh
