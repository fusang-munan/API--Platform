name: Lab TLS smoke test

on:
  pull_request:
    paths:
      - '.github/workflows/lab-tls.yml'
      - 'scripts/test-lab-port.sh'
      - 'frontend/lab-maintenance/**'
      - 'frontend/nginx.conf'
      - 'compose.local.yaml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the school frontend port
        run: bash scripts/test-lab-port.sh
