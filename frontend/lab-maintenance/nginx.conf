worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    map $ssl_preread_protocol $lab_destination {
        ""      127.0.0.1:8081;
        default 127.0.0.1:8444;
    }

    server {
        listen 8080;
        ssl_preread on;
        preread_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_timeout 10m;
        # This listener does not accept PROXY headers. It generates one for
        # its private loopback listeners using the socket's actual peer.
        proxy_protocol on;
        proxy_pass $lab_destination;
    }

    upstream lab_tls_backend {
        zone lab_tls_backend 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        server backend:8443 resolve;
    }

    server {
        listen 127.0.0.1:8444 proxy_protocol;
        proxy_connect_timeout 5s;
        proxy_timeout 10m;
        # The internal header ends here. Go receives the original TLS bytes.
        proxy_protocol off;
        proxy_pass lab_tls_backend;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    upstream lab_http_backend {
        zone lab_http_backend 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        server backend:8080 resolve;
    }

    include /tmp/lab-maintenance-http.conf;

    map $uri $lab_asset_cache_control {
        default "public, max-age=0, must-revalidate";
        # Vite writes fingerprinted build output directly under /assets/.
        "~^/assets/[^/]+-[A-Za-z0-9_-]{8}[.][^/.]+$" "public, max-age=31536000, immutable";
    }

    # Private file origin for the Go HTTPS listener.
    server {
        listen 8082;
        server_name _;
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "no-store";

        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        location = /index.html { try_files $uri =404; }
        location = /.well-known/nebula-release.txt { try_files $uri =404; }
        location = /user_manual.html { try_files $uri =404; }
        location = /codex-guide.html { try_files $uri =404; }
        location = /cc-switch-guide.html { try_files $uri =404; }
        location ~ ^/assets/(?:[^/.][^/]*/)*[^/.][^/]*\.[^/.]+$ {
            add_header Cache-Control $lab_asset_cache_control;
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
