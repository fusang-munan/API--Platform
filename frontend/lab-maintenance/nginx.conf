worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    map $ssl_preread_protocol $lab_destination {
        ""      127.0.0.1:8081;
        default 127.0.0.1:8444;
    }

    server {
        listen 8080;
        ssl_preread on;
        preread_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_timeout 10m;
        # This listener does not accept PROXY headers. It generates one for
        # its private loopback listeners using the socket's actual peer.
        proxy_protocol on;
        proxy_pass $lab_destination;
    }

    upstream lab_tls_backend {
        zone lab_tls_backend 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        server backend:8443 resolve;
    }

    server {
        listen 127.0.0.1:8444 proxy_protocol;
        proxy_connect_timeout 5s;
        proxy_timeout 10m;
        # The internal header ends here. Go receives the original TLS bytes.
        proxy_protocol off;
        proxy_pass lab_tls_backend;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    upstream lab_http_backend {
        zone lab_http_backend 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        server backend:8080 resolve;
    }

    include /tmp/lab-maintenance-http.conf;
}
