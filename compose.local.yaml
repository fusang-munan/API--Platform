# Local override: use mirrors/images already available on this server.
# Used by scripts/compose-local.sh only — not for production.
#
# proxy-relay: exposes host Clash (127.0.0.1:7890) on docker0 for backend outbound.
# Override with LOCAL_PROXY_PORT / LOCAL_PROXY_TARGET if your client uses another port.
services:
  proxy-relay:
    image: docker.1ms.run/alpine:3.22
    network_mode: host
    command:
      - sh
      - -c
      - |
        apk add --no-cache socat >/dev/null
        exec socat "TCP-LISTEN:$${LOCAL_PROXY_RELAY_PORT:-17890},fork,reuseaddr,bind=$${LOCAL_PROXY_BIND:-172.30.10.1}" "TCP:127.0.0.1:$${LOCAL_PROXY_TARGET_PORT:-7890}"
    environment:
      LOCAL_PROXY_RELAY_PORT: ${LOCAL_PROXY_RELAY_PORT:-17890}
      LOCAL_PROXY_BIND: ${LOCAL_PROXY_BIND:-172.30.10.1}
      LOCAL_PROXY_TARGET_PORT: ${LOCAL_PROXY_TARGET_PORT:-7890}
    restart: unless-stopped
  postgres:
    image: docker.1ms.run/postgres:17.5
  redis:
    image: docker.m.daocloud.io/library/redis:8.2.8-alpine3.22
  backend:
    ports: !override
      - "127.0.0.1:25556:8080"
    depends_on:
      proxy-relay:
        condition: service_started
    environment:
      LAB_MAINTENANCE_TLS_ADDR: ":8443"
      LAB_MAINTENANCE_TLS_DIR: /app/maintenance-tls
      LAB_MAINTENANCE_TLS_ORIGIN: https://106.55.103.208:25555
      LAB_MAINTENANCE_RELEASE: ${NEBULA_VERSION:?use scripts/compose-local.sh}
      # Single opt-in public certificate email for this release. See docs/FRP_PUBLIC_ACCESS.md.
      LAB_CERTIFICATE_NOTICE_REQUEST_SHA256: d934322d856eaa78f9cd4a91817cf34c27241a695904deb6cbf4a75fa8ec6643
      LAB_CERTIFICATE_NOTICE_EXPIRES_AT: "2026-11-18T16:00:00Z"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      BEICHEN_PANEL_TOKEN: ${BEICHEN_PANEL_TOKEN:-}
      BEICHEN_PANEL_GROUPS: ${BEICHEN_PANEL_GROUPS:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost,postgres,redis,172.30.10.1}
    volumes:
      - maintenance-tls:/app/maintenance-tls
  frontend:
    ports: !override
      - "127.0.0.1:25555:8080"
    entrypoint: ["/bin/sh", "/etc/nginx/lab-maintenance/start.sh"]
    command: ["nginx", "-c", "/etc/nginx/lab-maintenance/nginx.conf", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.10.0/24
  data:
    internal: true
    ipam:
      config:
        - subnet: 172.30.11.0/24

volumes:
  maintenance-tls:
